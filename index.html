<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Sales to QuickBooks Sync Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2ca01c; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Post Sales Invoice to QuickBooks</h2>
        <form id="invoiceForm">
            <div class="form-group">
                <label>Customer ID / Name</label>
                <input type="text" id="customerId" value="Mowe Residential Project" required>
            </div>
            <div class="form-group">
                <label>Item Description</label>
                <input type="text" id="itemName" value="Dangote Cement 50kg" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="qty" value="200" required>
            </div>
            <div class="form-group">
                <label>Unit Price (NGN)</label>
                <input type="number" id="unitPrice" value="8500" required>
            </div>
            <button type="submit">Sync Invoice to QBO</button>
        </form>
    </div>
</body>
</html>
